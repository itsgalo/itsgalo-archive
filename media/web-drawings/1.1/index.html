<!DOCTYPE html>
<html>
  <head>
    <title>assorted demo scenes by office ca</title>
    <meta charset="utf-8">
    <style>
      * {
        margin:0;
        padding:0;
      }

      body {
        height: 100%;
        overflow:hidden;
        background-color: #f7d722;

      }
      h1 {
        color: #fff;
        font-size: 36pt;
        font-family: "Helvetica", sans-serif;
        text-align: center;
        letter-spacing: -0.5px;
        vertical-align:middle;
        display:table-cell;
      }
      #banner {
        width:100%;
        height: 100%;
        position: absolute;
        display:table;
      }
    </style>
  </head>
  <body>
    <script src="./js/three.min.js"></script>
    <script src="./js/cannon.js"></script>
    <script src="./js/LegacyJSONLoader.js"></script>
    <script src="./CannonDebugRenderer.js"></script>

    <script>

      let world, timeStep=1/60, camera, scene, renderer;
      let material, material2, dashed, dashed2, wireframe, tex;

      let loader;
      let shapes = [];
      let bodies = [];
      let lines = [];
      let pts = [];
      let cannonDebug;
      let num = 5;
      let groundShape, groundBody;
      let geometry, curveGeo, curveObject;
      let c = 0;
      let angle = 0;
      //load textures and models
      tex = new THREE.TextureLoader().load('03Tex.png');
      loader = new THREE.LegacyJSONLoader();
      loader.load("mesh03.json",
        function (obj) {

          initCannon();
          initThree();
          animate();
          pushStaticObjects(obj);
          pushDynamicObjects();

          });
      function pushStaticObjects(obj) {

          var trunk = new THREE.Mesh(obj, material);
          trunk.receiveShadow = true;
          scene.add(trunk);

      }

      function randomNum(max) {
        return Math.floor(Math.random() * Math.floor(max));
      }

      function initCannon() {

          world = new CANNON.World();
          world.gravity.set(0,-9,0);
          world.broadphase = new CANNON.NaiveBroadphase();
          world.solver.iterations = 5;

          groundShape = new CANNON.Plane();
          groundBody = new CANNON.Body({ mass: 0 });
          groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);
          groundBody.addShape(groundShape);
          world.addBody(groundBody);

      }
      function initThree() {

          scene = new THREE.Scene();
          scene.background = new THREE.Color( 0xf7d722 );

          var aspect = window.innerWidth / window.innerHeight;
				  camera = new THREE.OrthographicCamera( 50 * aspect / - 2, 50 * aspect / 2, 50 / 2, 50 / - 2, -1000, 3000 );
          scene.add( camera );

          material = new THREE.MeshLambertMaterial({map: tex, transparent: true, side: THREE.DoubleSide});
          material2 = new THREE.MeshBasicMaterial( {color:0xff00ff} );
          wireframe = new THREE.MeshBasicMaterial( { color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0 } );
          dashed = new THREE.LineDashedMaterial( { color: 0x1c128c, dashSize: 0.3, gapSize: 0.3, linewidth: 5 } );
          dashed2 = new THREE.LineDashedMaterial( { color: 0xffffff, dashSize: 0.3, gapSize: 0.3, linewidth: 5 } );

          //var gridHelper = new THREE.GridHelper( 10, 10 );
          //scene.add( gridHelper );

          var ambientLight = new THREE.AmbientLight( 0x37acff  );
				  scene.add( ambientLight );
				  var directionalLight = new THREE.DirectionalLight( 0xc300d1 );
          directionalLight.position.set(0, 10, 0);
          directionalLight.position.normalize();
          directionalLight.castShadow = true;
          directionalLight.shadow.mapSize.width = 512;  // default
          directionalLight.shadow.mapSize.height = 512;
          directionalLight.shadow.camera.right = 50;
          directionalLight.shadow.camera.left = -50;
          directionalLight.shadow.camera.top  =  50;
          directionalLight.shadow.camera.bottom = -50;
          directionalLight.shadow.camera.near = -1000;
          directionalLight.shadow.camera.far = 3000;
				  scene.add( directionalLight );

          renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
          renderer.setSize( window.innerWidth, window.innerHeight );
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;

          document.body.appendChild( renderer.domElement );
          //controls = new THREE.OrbitControls( camera , renderer.domElement );
          //controls.update();
          renderer.domElement.addEventListener('mousedown', onMouseDown, false);

          cannonDebug = new THREE.CannonDebugRenderer( scene, world );

      }
      function pushDynamicObjects() {
          //worm maker
          for (var i = 0; i < num; i++){

              var geo = new THREE.BoxGeometry(2, 0.4, 0.4);
              var mesh = new THREE.Mesh(geo, material2);
              mesh.castShadow = true;
              scene.add(mesh);
              shapes.push(mesh);

              let mouseLine = new THREE.Geometry();
              mouseLine.vertices.push(
                new THREE.Vector3(-2, 0, 0),
                new THREE.Vector3(2, 0, 0)
              );

              let l = new THREE.Line(mouseLine, dashed2);
              l.computeLineDistances();
              scene.add(l);
              lines.push(l);

              let shape = new CANNON.Box(new CANNON.Vec3(1, 0.5, 0.5));
              let body = new CANNON.Body({
                mass: 1
              });
              body.addShape(shape);
              body.position.set((i * 1)-10, 20, 0);
              world.addBody(body);
              bodies.push(body);
          }

          for (let i = 0; i < bodies.length - 1; i++){
              let joint = new CANNON.ConeTwistConstraint(bodies[i], bodies[i+1], {
                pivotA: new CANNON.Vec3(-2,0,0),//midpoint of body A in negative
                pivotB: new CANNON.Vec3(2,0,0),//midpoint of body B in positive
                axisA: CANNON.Vec3.UNIT_X,
                axisB: CANNON.Vec3.UNIT_X,
                angle: Math.PI/4,
                twistAngle: Math.PI/8
              });

              world.addConstraint(joint);
            }
      }

      function onMouseDown(){
          //bodies[0].applyImpulse (new CANNON.Vec3(0,10,0), bodies[0].position);
          //drawScribble();
          //pushDynamicObjects();

      }
      function animate() {

          requestAnimationFrame( animate );
          updatePhysics();
          camera.lookAt(new THREE.Vector3(0, 6, 0));

          //camera.position.y = 1000;
          camera.position.y = 50;
          camera.position.x = 80 * Math.cos( angle );
          camera.position.z = 80 * Math.sin( angle );
          angle += 0.001;

          render();

      }

      function updatePhysics() {

          // Step the physics world
          world.step(timeStep);
          // Copy coordinates from Cannon.js to Three.js
          for (var i = 0; i < lines.length; i++) {

            shapes[i].position.copy(bodies[i].position);
            shapes[i].quaternion.copy(bodies[i].quaternion);
            lines[i].position.copy(bodies[i].position);
            lines[i].quaternion.copy(bodies[i].quaternion);
          }

          c++;
          if(c % 240 == 0){
            if(curveGeo){
              curveGeo.verticesNeedUpdate = true;
              curveObject.computeLineDistances();
              for (var j = 0; j < curveGeo.vertices.length; j++ ) {
                curveGeo.vertices[j].y = Math.random() * 25 - 8;
              }
            }
          }
          if(c % 60 == 0){
            //bodies[0].applyImpulse (new CANNON.Vec3(0,randomNum(50),0), bodies[0].position);
            //bodies[5].applyImpulse (new CANNON.Vec3(0,randomNum(50),0), bodies[0].position);
            //var dis = new THREE.Vector3(0 - bodies[2].position.x, 0 - bodies[2].position.y, 0 - bodies[2].position.z);
            //bodies[2].applyImpulse(dis, bodies[2].position);
            for (var i = 0; i < bodies.length; i++) {
              var dis = new THREE.Vector3(0 - bodies[i].position.x, 0 - bodies[i].position.y, 0 - bodies[i].position.z);
              bodies[i].applyImpulse(dis, bodies[i].position);
            }
          }
          if(c % 180 == 0){
            pushDynamicObjects();
          }

          if (bodies.length > 20) {
            scene.remove(lines[0]);
            lines.splice(0, 1);
            scene.remove(shapes[0]);
            shapes.splice(0, 1);
            world.removeBody(bodies[0]);
            bodies.splice(0, 1);
          }
      }

      function render() {
        if(c % 1000 == 0){
          //window.location.reload();
          window.location.replace(randomNum(3) + ".html");
        }
          renderer.render( scene, camera );
          //cannonDebug.update();
      }

    </script>
    <div id="banner"><h1>assorted demo scenes<br>by office ca</h1></div>
  </body>
</html>
