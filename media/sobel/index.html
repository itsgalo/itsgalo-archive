		<script>
			function onMetadata() {
					window.top?.postMessage("genart:metadata:" + JSON.stringify(window.METADATA), "*")
			}
			function onDone() {
					window.top?.postMessage("genart:done", "*"),
					window.onImageRendered && window.onImageRendered()
			}
			function random_hash() {
					var t = "0123456789abcdef";
					let n = "0x";
					for (let e = 64; 0 < e; --e)
							n += t[Math.floor(Math.random() * t.length)];
					return n
			}
			window.METADATA = {};
			class Random {
					seed;
					decimals;
					constructor(e, t=3) {
							this.seed = parseInt(e.slice(0, 16), 16),
							this.decimals = t
					}
					random_dec() {
							return this.seed ^= this.seed << 13,
							this.seed ^= this.seed >> 17,
							this.seed ^= this.seed << 5,
							(this.seed < 0 ? 1 + ~this.seed : this.seed) % 10 ** this.decimals / 10 ** this.decimals
					}
					random_between(e, t) {
							return e + (t - e) * this.random_dec()
					}
					random_int(e, t) {
							return Math.floor(this.random_between(e, t + 1))
					}
					random_choice(e) {
							return e[Math.floor(this.random_between(0, .99 * e.length))]
					}
			}
	</script>
