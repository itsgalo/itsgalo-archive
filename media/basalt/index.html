				<canvas></canvas>

        <script>
          function genRandData(projectNum) {
            let data = {};
            let hash = "0x";

            for (var i = 0; i < 64; i++) {
              hash += Math.floor(Math.random() * 16).toString(16);
            }

            data.hash = hash;
            data.tokenId = (
              projectNum * 1000000 +
              Math.floor(Math.random() * 1000)
              ).toString();

            return data;
          }
          var q = new URLSearchParams(window.location.search).get("payload");
          var p = JSON.parse(q ? atob(q) : "{}");
          var vhash = p.hash || genRandData(999).hash;
          var editionNumber = p.editionNumber || 0;
    
          // calling `capturePreview` with trigger preview capture
          function capturePreview() {
            dispatchEvent(new Event("capture-preview"));
            console.log('preview captured!')
          }
        </script>
